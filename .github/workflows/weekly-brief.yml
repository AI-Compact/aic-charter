name: weekly-brief
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const counts = {};
            for (const label of ["app:received","app:public-notice","app:objection","app:approved","app:rejected"]) {
              const r = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue label:"${label}"`
              });
              counts[label] = r.data.total_count;
            }
            const body = [
              "<!-- weekly-brief-draft -->",
              "Draft generated by an automated system. Review before publishing.",
              "",
              "```json",
              JSON.stringify(counts, null, 2),
              "```",
              "",
              "Seat counts must be filled from the ledger, not from memory."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Weekly brief (draft) ${new Date().toISOString().slice(0,10)}`,
              body, labels: ["brief:draft"]
            });
